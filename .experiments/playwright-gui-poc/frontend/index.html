<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playwright GUI PoC</title>
  </head>
  <body>
    <main id="app">
      <section id="question-page">
        <h1>Is this a test?</h1>
        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
      </section>

      <section id="yes-page" hidden>
        <h1>You said yes</h1>
        <p>Here is what the backend had to say about that:</p>
        <p id="yes-text"></p>
        <button class="back-btn" id="yes-back">Back</button>
      </section>

      <section id="no-page" hidden>
        <h1>You said no</h1>
        <p>Here is what the backend had to say about that:</p>
        <p id="no-text"></p>
        <button class="back-btn" id="no-back">Back</button>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
