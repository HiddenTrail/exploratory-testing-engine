# Serve Sauce Demo as a single-page app.
#
# The app does its own routing in the browser, so a direct request for a page
# like /inventory.html has to return index.html and let the JavaScript render it.
# Login is a cookie the app checks in the browser (`session-username`). nginx
# serves every page the same way, so you only get past the login in a real
# browser, not with a plain HTTP fetch.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
